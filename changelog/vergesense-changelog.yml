observations:
  cadence: >-
    Roughly one entry per quarter over three and a half years, with a marked slowdown through 2025-26
    (five entries in the last twenty months) followed by the March 2026 Predict/LSM release.
  breaking_change_handling: >-
    Breaking changes are announced with a stated effective date ahead of the change (2026-04-01 for
    the space-type deprecation; 2024-12-04 for the metric rounding). The announcement is prose in a
    changelog, not a Sunset header or a deprecated flag in the OpenAPI.
  gap: >-
    The changelog is the only channel. There is no version-diff endpoint, no per-version spec
    archive, and the published OpenAPI does not carry deprecated: true for the March 2026 deprecation.
