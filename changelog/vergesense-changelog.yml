summary: >-
  VergeSense runs a real, dated, publicly readable API changelog on Headway with an RSS feed, and its
  own documentation names it as the authoritative place API changes are announced. Entries are typed
  (New / Improvement / Deprecation), name the exact endpoint affected, and — for breaking changes —
  state an effective date in advance. Twenty entries are in the feed, spanning 2023-02 to 2026-03.

