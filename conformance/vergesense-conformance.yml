domain_standard:
  declared: false
  market: workplace occupancy intelligence / corporate real estate / smart buildings
  probed_for:
  - {standard: Brick Schema, found: false}
  - {standard: Project Haystack, found: false}
  - {standard: BACnet / BACnet Web Services, found: false}
  - {standard: ASHRAE 223P, found: false}
  - {standard: IFC / buildingSMART, found: false}
  - {standard: RESO Data Dictionary, found: false}
  - {standard: OGC GeoJSON, found: partial}
  geojson_note: >-
    The Predict API takes a GeoJSON of the spaces on a floor as its request body (see
    https://vergesense.readme.io/reference/predict-api-geojson), which is the closest thing to a
    domain interchange format in this contract. GeoJSON is RFC 7946, a geometry encoding rather than
    a workplace-domain data model, so it is recorded as partial and NOT claimed as domain-standard
    conformance.
  assessment: >-
    VergeSense models buildings, floors, spaces, space types, neighborhoods and space groups in a
    proprietary vocabulary with a dual identifier scheme (VergeSense numeric ids alongside
    customer-defined *_ref_id strings). The *_ref_id design is a deliberate BYO-identifier bridge to
    a customer's IWMS/CAFM rather than an adoption of a shared industry ontology. A buyer already
    speaking Brick or Haystack needs a bespoke mapping. Reward-only check: no penalty is implied.

compliance_certifications:
  published: false
  probes:
  - {url: 'https://trust.vergesense.com', status: NXDOMAIN}
  - {url: 'https://www.vergesense.com/security', status: 404}
  - {url: 'https://www.vergesense.com/trust', status: 404}
  - {url: 'https://www.vergesense.com/data-privacy-security', status: 404}
  note: >-
    No trust centre and no named certification (SOC 2, ISO 27001, PCI, HIPAA, FedRAMP) is published on
    any reachable VergeSense page, and the privacy policy names none. NO Compliance and NO TrustCenter
    pointer is emitted in apis.yml — an unsupported Compliance pointer would be a claim made on the
    provider's behalf. For a vendor selling occupancy sensors into Fortune 500 offices this is a
    conspicuous gap; the certifications may well exist behind the sales process, but they are not
    public.
