summary: >-
  VergeSense declares one cross-cutting media-type standard in its contract (JSON:API, named by URL
  in the descriptions of its paginated collection endpoints) and implements two OAuth discovery RFCs
  on the MCP surface. It declares NO domain standard for the workplace/PropTech market it sells into
  — no Brick Schema, no Project Haystack, no BACnet/Web Services, no RESO, no ASHRAE/IFC identifier
  scheme appears anywhere in the contract or the docs. That is recorded as not-declared, not as a
  failure: domain_standard_conformance is reward-only and this market's standards are optional.

standards:
- id: jsonapi
  name: 'JSON:API v1.x'
  conforms: true
  scope: partial
  evidence:
    type: contract-description
    detail: >-
      The published OpenAPI operation descriptions for /spaces/detections, /hardware/sensors and
      /hardware/gateways each state "Response conforms to the JSON API spec https://jsonapi.org/",
      and the Links reference page documents the links.next / links.previous members with
      page[number] / page[size] query parameters — the JSON:API pagination profile.
    locations:
    - openapi/vergesense-api-openapi.json#/paths/~1spaces~1detections/get/description
    - openapi/vergesense-api-openapi.json#/paths/~1hardware~1sensors/get/description
    - openapi/vergesense-api-openapi.json#/paths/~1hardware~1gateways/get/description
    urls:
    - https://vergesense.readme.io/reference/spaces_detections
    - https://vergesense.readme.io/reference/links
  additional_evidence:
    type: response-examples
    detail: >-
      The conformance is broader than the three descriptions that name it. The response examples
      embedded in the published spec show the JSON:API DOCUMENT structure across the metrics surface
      too — success bodies are {"data":[{"id","type":"metrics_hourly_space","attributes":{...}}]} and
      error bodies are the JSON:API errors object
      {"errors":[{"status","title","detail","source":{"parameter"}}]}. That is the resource-object
      and error-object shape, not merely the pagination profile.
    file: examples/vergesense-api-examples.json
  caveat: >-
    Three deviations keep this from being full conformance. The API does not advertise the JSON:API
    media type (application/vnd.api+json) — responses are application/json. The optional errors[].code
    member is never emitted, so there is no stable application error code. And two operations break
    the error envelope outright: GET /buildings/{building_ref_id}/history returns errors[] as an
    array of bare strings, and GET /buildings documents an empty object.

- id: iso8601
  name: ISO 8601 date and time
  conforms: true
  evidence:
    type: documented
    detail: >-
      "Timestamps should be specified in ISO 8601 format... Timestamps will be returned in ISO 8601
      UTC format, for example: 2019-01-15T23:30:28Z." Both offset and Z request forms are accepted.
    url: https://vergesense.readme.io/reference/reference-getting-started

- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  surface: mcp
  evidence:
    type: probed
    detail: >-
      https://mcp.vergesense.com/mcp answers an anonymous request with 401 and
      WWW-Authenticate: Bearer resource_metadata="https://mcp.vergesense.com/.well-known/oauth-protected-resource/mcp";
      that document resolves 200 and carries resource, authorization_servers and
      bearer_methods_supported.
    url: https://mcp.vergesense.com/.well-known/oauth-protected-resource/mcp
    file: well-known/vergesense-mcp-oauth-protected-resource.json
    probed: '2026-09-02'

- id: oauth2
  name: OAuth 2.0
  conforms: true
  scope: mcp-only
  evidence:
    type: probed
    detail: >-
      The MCP surface is bearer-token OAuth 2.0 delegated to https://vergesense.auth0.com/. The REST
      API at api.vergesense.com is NOT OAuth — it uses a static vs-api-key header.
    url: https://vergesense.auth0.com/.well-known/openid-configuration
    file: well-known/vergesense-auth0-openid-configuration.json

- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  scope: authorization-server-only
  operator: Auth0 tenant operated for VergeSense
  evidence:
    type: probed
    detail: >-
      https://vergesense.auth0.com/.well-known/openid-configuration returns 200 with issuer
      https://vergesense.auth0.com/ and advertises authorization_code, client_credentials,
      refresh_token and device_code grants plus dynamic client registration at /oidc/register.
    url: https://vergesense.auth0.com/.well-known/openid-configuration
  caveat: >-
    This is discovery on the identity provider, delivered by Auth0's platform, not something
    VergeSense implemented on its own product API. Recorded honestly at that strength.

