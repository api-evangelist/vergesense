summary: >-
  One real document is served, and it is served on two hosts: the RFC 9728 OAuth 2.0 Protected
  Resource Metadata for the remote MCP server, which names https://vergesense.auth0.com/ as the
  authorization server. That is a genuine WellKnown hit and the pointer is earned. Nothing else is
  served anywhere: no security.txt on any host (so NO SecurityTxt pointer), no api-catalog, no
  ai-plugin.json, no OIDC discovery on a VergeSense-operated host, and no A2A agent card.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the 200s on
  mcp.vergesense.com/.well-known/oauth-protected-resource/mcp and the identical document served at
  api.vergesense.com. SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on every host.
  AgentCard pointer NOT emitted — /.well-known/agent-card.json and the legacy /.well-known/agent.json
  404 on every host probed.
false_positive_watch: >-
  www.vergesense.com is a HubSpot CMS site that answers every unknown path — including every
  /.well-known/* path — with HTTP 404 and a 90KB HTML 404 page, so there is no soft-200 trap there.
  api.vergesense.com returns a zero-length text/html 404 for unknown paths. Neither host was credited
  with a document it does not serve.
