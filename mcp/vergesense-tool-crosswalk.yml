summary: >-
  VergeSense ships BOTH a public OpenAPI and a remote MCP server, so a crosswalk is warranted. It
  cannot yet be a tool-to-operation binding: the MCP tool list is OAuth-gated (HTTP 401 on an
  anonymous tools/list) and no MCP tool reference is published in the docs or the llms.txt, so there
  are no real tool names to bind. Rather than invent them, this file publishes the complete REST
  operation inventory an authenticated introspection should be bound against, plus the surfaces
  block, so a future round with a bearer token can fill crosswalk[] in one pass.
