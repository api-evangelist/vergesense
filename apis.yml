aid: vergesense
name: VergeSense
description: VergeSense is the occupancy intelligence platform for corporate real estate and workplace
  teams. It combines first-party AI-powered area, entryway and infinity sensors with a cloud analytics
  platform (Meridian, including a Large Spatial Model) to measure how buildings, floors, neighborhoods
  and individual spaces are actually used. The public VergeSense API is a key-authenticated REST surface
  at api.vergesense.com covering buildings, floors, spaces, space types, detections, threshold crossings,
  hourly and aggregate occupancy metrics, hardware inventory (sensors and gateways), a Predict API built
  on the Large Spatial Model, and a fully managed webhook subscription surface that pushes space_report,
  space_availability and motion_detected events to customer endpoints. Collection responses follow the
  JSON:API specification, timestamps are ISO 8601, and the API is date-versioned (YYYY-MM-DD) via the
  vs-version request header. VergeSense also operates an OAuth-protected remote MCP server at mcp.vergesense.com
  for agent access.
