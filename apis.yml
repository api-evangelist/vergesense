apis:
- aid: vergesense-api
  name: VergeSense API
  description: >-
    REST and webhook API for the VergeSense Cloud occupancy intelligence platform. Read buildings,
    floors, spaces, space types, neighborhoods, space groups, detections and threshold crossings;
    pull hourly and aggregate occupancy, utilization and headcount metrics at portfolio, building,
    floor, neighborhood, space-type, space-group and space level; inventory sensors and gateways;
    call the Predict API (space usage, space shortage, normalized space type distribution) built on
    the VergeSense Large Spatial Model; and create, patch, enable, disable, delete and inspect the
    delivery logs of webhooks that push space_report, space_availability and motion_detected events.
