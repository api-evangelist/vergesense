  - name: VergeSense Standard Support Policy
    url: https://www.vergesense.com/hubfs/VergeSense%20Standard%20Support%20Policy.pdf
  - name: VergeSense Service Subscription Agreement
    url: https://www.vergesense.com/hubfs/VergeSense%20Service%20Subscription%20Agreement.pdf
  index: https://www.vergesense.com/legal
  note: >-
    Support and SLA commitments are published as PDFs on the legal page rather than as web pages or
    machine-readable terms. Uptime targets were not extracted — the PDFs were listed, not parsed.

support:
  channel: https://support.vergesense.com/hc/en-us
  platform: Zendesk
  email: support@vergesense.com
  note: >-
    The help centre returns HTTP 403 to a non-browser user agent (an ordinary Zendesk bot policy),
    not a dead link. It is also the gate for API credentials — see authentication/.

