summary: >-
  VergeSense publishes NO pricing of any kind. There is no /pricing page, no plan or tier comparison,
  no per-sensor or per-square-foot list price, no free tier and no API metering schedule. The whole
  commercial funnel is a sales conversation: "Talk to a specialist", "Get a demo", and a Strategic
  Advisory Services / Managed Services track. This is consistent with the product — a deployment
  requires physical sensor hardware installed in a customer's buildings — but it means an agent or a
  buyer cannot price the API without contacting sales, and no Pricing pointer is emitted in apis.yml
  because the page it would point at does not exist.
