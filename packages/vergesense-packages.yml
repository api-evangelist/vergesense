source: >-
  Registry sweeps of npm (registry.npmjs.org search), PyPI, RubyGems, crates.io, NuGet and Packagist
  for a first-party VergeSense client library, plus the provider's documentation index
  (https://vergesense.readme.io/llms.txt), the Getting Started page and the GitHub organization.
summary:
  first_party_sdk_count: 0
  third_party_package_count: 0
  note: >-
    VergeSense publishes NO client library in any public package registry, in any language, as of
    2026-09-02. Its own published integration story is raw REST over api.vergesense.com with a
    vs-api-key header, webhooks pushed to a customer endpoint, a public Postman collection, and
    packaged connectors inside partner platforms (Archibus, Robin, and other IWMS products) that are
    built and shipped by those partners rather than by VergeSense. Because no official SDK exists,
    this repo emits NO SDKs pointer in apis.yml — the ergonomics sdk_count check must read a genuine
    zero here.

