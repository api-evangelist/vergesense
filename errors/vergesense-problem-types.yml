webhook_delivery_errors:
  note: Failure semantics in the OUTBOUND direction, for the customer's receiver.
  expectations:
  - Data is only sent to HTTPS endpoints.
  - The receiver must respond with a 2xx status code.
  - The receiver must respond within 5 seconds.
  auto_disable: >-
    If more than 99% of deliveries fail within a 24-hour window VergeSense automatically disables the
    webhook and emails the subscriber with the top errors; the subscriber fixes the receiver and
    re-enables with POST /webhooks/{id}/enable.
  delivery_log: GET /webhooks/{id}/logs
  source: https://vergesense.readme.io/reference/events

gaps:
- No RFC 9457 problem+json.
- No stable application error code — JSON:API's optional `code` member is never emitted, so clients branch on prose titles.
- No error SCHEMA in the OpenAPI; the envelope is only knowable from response examples.
- Two operations deviate from the envelope (bare strings, and an empty object).
- 403, 409 and 429 are documented in prose but absent from the contract entirely.
- The Predict API declares no error responses at all.
