openapi: 3.2.0
info:
  title: vergesense-api Metrics API
  version: '2021-03-29'
servers:
- url: https://api.vergesense.com
security:
- sec0: []
tags:
- name: Metrics
paths:
  /metrics/hourly/spaces:
    get:
      summary: /metrics/hourly/spaces
      description: Hourly metrics for spaces
      operationId: metrics_hourly_spaces
      parameters:
      - name: sort
        in: query
        description: Comma separated list of attributes used to sort the collection. Use a negative(-) sign to reverse the order.
        schema:
          type: string
          default: -space_id,-local_date,-local_hour
      - name: fields[metrics_hourly_space]
        in: query
        description: Limit attributes that are included in a request. Comma separated list of attributes.
        schema:
          type: string
      - name: page[number]
        in: query
        description: Page number for pagination.
        schema:
          type: integer
          format: int32
          default: 1
      - name: page[size]
        in: query
        description: Amount of records to return per page. Limit is 1000.
        schema:
          type: integer
          format: int32
          default: 250
      - name: filter[space_type.key]
        in: query
        description: Filter metrics based on its associated space type's key.
        schema:
          type: string
      - name: filter[space_type.name]
        in: query
        description: Filter metrics based on its associated space type's name.
        schema:
          type: string
      - name: filter[building_ref_id]
        in: query
        description: Filter metrics based on its associated space's building_ref_id.
        schema:
          type: string
      - name: filter[floor_ref_id]
        in: query
        description: Filter metrics based on its associated space's floor_ref_id.
        schema:
          type: string
      - name: filter[space_ref_id]
        in: query
        description: Filter metrics based on its associated space's space_ref_id.
        schema:
          type: string
      - name: filter[local_date][gte]
        in: query
        description: Filter metrics where local_date is greater than or equal to value.
        schema:
          type: string
          format: date
          example: '2020-11-01'
        example: '2020-11-01'
      - name: filter[local_date][lte]
        in: query
        description: Filter metrics where local_date is less than or equal to value.
        schema:
          type: string
          format: date
      - name: filter[local_hour][gte]
        in: query
        description: Number between 0-23. Filter metrics where local_hour is greater than or equal to value.
        schema:
          type: integer
          format: int32
          example: 8
        example: 8
      - name: filter[local_hour][lte]
        in: query
        description: Number between 0-23. Filter metrics where local_hour is less than or equal to value.
        schema:
          type: integer
          format: int32
          example: 16
        example: 16
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"data\": [\n        {\n            \"id\": \"1\",\n            \"type\": \"metrics_hourly_space\",\n            \"attributes\": {\n                \"local_date\": \"2021-11-01\",\n                \"local_hour\": 8,\n                \"capacity\": 25,\n                \"avg_person_count\": \"0.5\",\n                \"min_person_count\": 0,\n                \"max_person_count\": 25,\n                \"minutes_actively_occupied\": \"21.6\",\n                \"minutes_passively_occupied\": null,\n                \"avg_pct_utilization\": 0.04,\n                \"min_pct_utilization\": 0.0,\n                \"max_pct_utilization\": 2.0,\n                \"pct_time_actively_occupied\": \"0.36\",\n                \"pct_time_passively_occupied\": null\n            },\n            \"relationships\": {\n                \"space\": {\n                    \"data\": {\n                        \"id\": \"1\",\n                        \"type\": \"space\"\n                    }\n                }\n            }\n        }\n    ],\n    \"included\": [\n        {\n            \"id\": \"1\",\n            \"type\": \"space\",\n            \"attributes\": {\n                \"name\": \"Conference Room 1\",\n                \"space_ref_id\": \"conference_room_1\",\n                \"building_ref_id\": \"building_1\",\n                \"floor_ref_id\": \"floor_1\",\n            },\n            \"relationships\": {\n                \"space_type\": {\n                    \"data\": {\n                        \"id\": \"3\",\n                        \"type\": \"space_type\"\n                    }\n                }\n            }\n        },\n        {\n            \"id\": \"3\",\n            \"type\": \"space_type\",\n            \"attributes\": {\n                \"name\": \"Conference Room\",\n                \"key\": \"conference_room\"\n            }\n        }\n    ],\n    \"links\": {\n        \"next\": \"/metrics/hourly/spaces?filter[local_date][gte]=2020-11-01&filter[local_hour][gte]=8&filter[local_hour][lte]=16&page[number]=2&page[size]=0&sort=-local_date,local_hour\",\n        \"prev\": null\n    }\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"errors\": [\n        {\n            \"status\": \"400\",\n            \"source\": {\n                \"parameter\": \"filter[local_date]\"\n            },\n            \"title\": \"Invalid Parameter\",\n            \"detail\": \"Invalid Date\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: '400'
                        source:
                          type: object
                          properties:
                            parameter:
                              type: string
                              example: filter[local_date]
                        title:
                          type: string
                          example: Invalid Parameter
                        detail:
                          type: string
                          example: Invalid Date
      deprecated: false
      tags:
      - Metrics
