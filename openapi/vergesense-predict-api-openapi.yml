                      attributes:
                        person_count: 50
                        normalized_space_types:
                          enclosed_collab:
                          - capacity: 4
                            spaces:
                            - id: 63584e0184e36d00352450d4
                              name: Hudson
                            - id: 63584e0184e36d00352450d5
                              name: Thames
                            histogram:
