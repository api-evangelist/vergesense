  /predict/space_shortage:
    post:
      description: Given a geojson of spaces on a floor, this endpoint would return the predicted number of people in attendance at which point a meaningful number of people would be unable to find a space to work.
      responses:
        '200':
          description: ''
      parameters:
      - in: header
        name: Content-Type
        schema:
          type: string
          default: application/geo+json
        required: true
      requestBody:
        content:
          application/geo+json:
            schema:
              type: object
              properties: {}
            examples:
              'Example: Shortage Percentage':
                summary: 'Example: Shortage Percentage'
                value:
                  shortage_pct: 0.05
                  type: FeatureCollection
                  features:
                  - type: Feature
                    geometry:
                      type: Polygon
                      coordinates:
                      - - - -73.55364893892498
                          - 45.49486993647466
                        - - -73.55363974022207
                          - 45.494866436003335
                        - - -73.55362414242448
                          - 45.49486053520767
                        - - -73.55361354406915
                          - 45.494874237252944
                        - - -73.55364893892498
                          - 45.49486993647466
                    properties:
                      id: 63584e0184e36d00352450d4
                      capacity: 4
                      normalized_space_type: enclosed_collab
      operationId: post_predict-space-shortage
      summary: Predict Space Shortage
      tags:
      - Predict
  /predict/normalized_space_type_distribution:
    post:
